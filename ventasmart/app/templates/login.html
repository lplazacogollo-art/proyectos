{% extends "base.html" %}
{% block title %}Bienvenido a VentaSmart{% endblock %}
{% block content %}
<div class="row g-0 min-vh-100">
  <!-- Panel izquierdo estilo Twitter/X con emblema gigante -->
  <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center" style="background-color:#172554;">
    <svg viewBox="0 0 240 240" width="260" height="260" fill="none" aria-label="VentaSmart">
      <rect x="16" y="16" width="208" height="208" rx="48" fill="#2563EB"/>
      <path d="M64 78L98 164L132 78" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M174 92C174 82 164 76 152 76C140 76 132 83 132 93C132 104 142 109 155 113C169 117 178 123 178 136C178 150 166 160 150 160C136 160 126 153 124 143" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Panel derecho de entrada estilo Twitter/X -->
  <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white p-4 p-md-5">
    <div style="max-width:380px; width:100%;">
      <div class="d-flex align-items-center gap-2 mb-4">
        <span class="badge bg-primary fs-6 px-2 py-2">VS</span>
        <span class="fs-5 fw-bold" style="color:#172554;">VentaSmart</span>
      </div>
      <h1 class="display-6 fw-bold mb-3" style="color:#0F172A;">Lo que pasa en tu negocio, hoy.</h1>
      <p class="fs-5 fw-bold mb-4">Entra fácil y sin requisitos.</p>

      <div class="d-grid gap-2 mb-3">
        <form method="POST" action="{{ url_for('auth.guest_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-primary rounded-pill fw-bold py-2 w-100">
            Entrar directo sin requisitos
          </button>
        </form>
        <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary rounded-pill fw-bold py-2">
          Entrar con tu nombre (opcional)
        </a>
      </div>
      <div class="d-flex align-items-center gap-2 my-3 text-muted small">
        <hr class="flex-grow-1"><span>o</span><hr class="flex-grow-1">
      </div>
      <p class="fw-bold small mb-2">¿Ya tienes una cuenta?</p>
      <div class="d-grid">
        <button type="button" class="btn btn-outline-primary rounded-pill fw-bold py-2" data-bs-toggle="modal" data-bs-target="#loginModal">
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Iniciar sesión estilo Twitter/X -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 p-3">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Inicia sesión en VentaSmart</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="modal-body">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Correo electrónico</label>
            <input type="email" name="correo" class="form-control form-control-lg" required placeholder="admin@ventasmart.co">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Contraseña</label>
            <input type="password" name="password" class="form-control form-control-lg" required>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="submit" class="btn btn-dark rounded-pill w-100 fw-bold py-2">Iniciar sesión</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
