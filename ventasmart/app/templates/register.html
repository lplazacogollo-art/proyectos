{% extends "base.html" %}
{% block title %}Registro de Usuario{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="vs-card p-4 p-md-5">
        <h1 class="h4 fw-bold mb-1" style="color:#172554;">Entra a VentaSmart</h1>
        <p class="text-muted small mb-4">Todos los campos son opcionales: entra con tu nombre o directamente.</p>
        <form method="POST" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Tu nombre (opcional)</label>
            <input type="text" name="nombre" class="form-control" placeholder="Ej. María Fernanda López">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Correo electrónico (opcional)</label>
            <input type="text" name="correo" class="form-control" placeholder="Opcional">
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold">Contraseña (opcional)</label>
            <input type="password" name="password" class="form-control" placeholder="Opcional">
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold">Entrar ahora</button>
        </form>
        <div class="text-center mt-3 small">
          ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
